<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#162c29" />
    <title>Paperbase · 个人论文工作站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div>
            <strong>paperbase</strong>
            <small>PERSONAL WORKSTATION</small>
          </div>
        </div>

        <div class="sidebar-section-label">工作区</div>
        <nav class="main-nav" aria-label="论文筛选">
          <button class="nav-item active" data-filter="all"><span class="nav-icon">▦</span><span>全部论文</span><em id="allCount">0</em></button>
          <button class="nav-item" data-filter="reading"><span class="nav-icon">◒</span><span>正在阅读</span><em id="readingCount">0</em></button>
          <button class="nav-item" data-filter="read"><span class="nav-icon">✓</span><span>已读</span><em id="readCount">0</em></button>
          <button class="nav-item" data-filter="later"><span class="nav-icon">◷</span><span>稍后阅读</span><em id="laterCount">0</em></button>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="sidebar-section-label">标签</div>
        <div class="tag-list">
          <button class="tag-filter" data-tag="LLM"><span class="tag-dot orange"></span>LLM</button>
          <button class="tag-filter" data-tag="Agent"><span class="tag-dot purple"></span>Agent</button>
          <button class="tag-filter" data-tag="RAG"><span class="tag-dot blue"></span>RAG</button>
          <button class="tag-filter" data-tag="Evaluation"><span class="tag-dot green"></span>Evaluation</button>
        </div>

        <div class="sidebar-footer">
          <div class="storage-card">
            <div class="storage-top"><span>本地存储</span><span>自动保存</span></div>
            <div class="storage-bar"><span></span></div>
            <p>数据只保存在当前浏览器中</p>
          </div>
          <div class="profile"><div class="avatar">Y</div><div><strong>Yuki</strong><span>研究工作者</span></div><button aria-label="更多设置">•••</button></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>我的研究库</span><i>/</i><strong id="viewTitle">全部论文</strong></div>
          <div class="topbar-actions">
            <button class="icon-button" aria-label="通知">♢<span class="notification-dot"></span></button>
            <button class="help-button">?</button>
            <button class="primary-button" id="newPaperBtn"><span>＋</span> 新建论文</button>
          </div>
        </header>

        <section class="workspace">
          <div class="library-panel">
            <div class="library-heading">
              <div><p class="eyebrow">COLLECTION / 2026</p><h1>论文库 <span id="libraryCount">0</span></h1></div>
              <button class="more-button" aria-label="更多操作">•••</button>
            </div>
            <div class="library-toolbar">
              <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="搜索论文、会议或标签" /><kbd>⌘ K</kbd></label>
              <button class="sort-button" id="sortBtn">最近更新 <span>↕</span></button>
            </div>
            <div class="paper-list" id="paperList"></div>
            <div class="empty-state" id="emptyState" hidden><div class="empty-icon">⌁</div><h3>还没有找到论文</h3><p>尝试调整搜索词，或新建一篇论文。</p></div>
          </div>

          <section class="detail-panel" id="detailPanel">
            <div class="detail-empty" id="detailEmpty"><div class="detail-empty-mark">✦</div><h2>选择一篇论文</h2><p>从左侧列表选择论文，开始整理你的研究思路。</p></div>
            <div class="detail-content" id="detailContent" hidden>
              <div class="detail-header">
                <div class="detail-heading"><div class="status-row"><span class="status-pill" id="detailStatus">正在阅读</span><span class="updated" id="detailUpdated">刚刚更新</span></div><h2 id="detailTitle"></h2><p class="detail-venue" id="detailVenue"></p></div>
                <div class="detail-actions"><button class="secondary-button" id="editBtn">编辑</button><button class="delete-button" id="deleteBtn" aria-label="删除论文">⌫</button></div>
              </div>
              <div class="detail-meta" id="detailTags"></div>
              <div class="insight-card"><div class="insight-icon">↗</div><div><span>阅读进度</span><strong id="progressLabel">正在形成初步理解</strong></div><div class="progress-track"><span id="progressBar"></span></div></div>
              <div class="field-view"><div class="field-title"><span class="field-symbol">≡</span><h3>概要</h3></div><p id="detailSummary"></p></div>
              <div class="field-view"><div class="field-title"><span class="field-symbol accent">✳</span><h3>创新点</h3></div><div id="detailInnovations" class="rich-lines"></div></div>
              <div class="field-view notes-view"><div class="field-title"><span class="field-symbol yellow">▤</span><h3>我的笔记</h3></div><p id="detailNotes"></p></div>
              <div class="detail-bottom"><span id="detailDate"></span><button class="link-button" id="duplicateBtn">复制这篇论文 <span>↗</span></button></div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="paper-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header"><div><p class="eyebrow">PAPER ENTRY</p><h2 id="modalTitle">新建论文</h2></div><button class="close-button" id="closeModal" aria-label="关闭">×</button></div>
        <form id="paperForm">
          <div class="form-grid"><label class="form-field wide"><span>论文名称 <b>*</b></span><input name="title" required placeholder="输入论文完整标题" /></label><label class="form-field"><span>会议 / 期刊 <b>*</b></span><input name="venue" required placeholder="例如 NeurIPS 2025" /></label><label class="form-field"><span>年份</span><input name="year" type="number" min="1900" max="2100" placeholder="2026" /></label><label class="form-field"><span>阅读状态</span><select name="status"><option value="reading">正在阅读</option><option value="read">已读</option><option value="later">稍后阅读</option></select></label><label class="form-field"><span>标签</span><input name="tags" placeholder="用逗号分隔，如 LLM, RAG" /></label><label class="form-field wide"><span>概要</span><textarea name="summary" rows="4" placeholder="用自己的话概括这篇论文解决了什么问题……"></textarea></label><label class="form-field wide"><span>创新点</span><textarea name="innovations" rows="4" placeholder="每行记录一个创新点"></textarea></label><label class="form-field wide"><span>我的笔记</span><textarea name="notes" rows="4" placeholder="记录启发、疑问和后续行动……"></textarea></label></div>
          <div class="modal-footer"><button type="button" class="cancel-button" id="cancelModal">取消</button><button type="submit" class="primary-button">保存论文 <span>↗</span></button></div>
        </form>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
